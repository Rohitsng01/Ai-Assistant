<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JARVIS - Your intelligent virtual assistant powered by voice recognition">
    <meta name="theme-color" content="#00bcd4">
    <title>JARVIS - AI Assistant</title>
    <link rel="shortcut icon" href="avatar.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body>
    <!-- Background Effects -->
    <div class="background-effects">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <!-- Main Container -->
    <main class="main">
        <div class="container">
            <!-- Header Section -->
            <header class="header">
                <div class="logo-container">
                    <div class="logo-ring"></div>
                    <div class="logo-core">
                        <i class="fas fa-brain"></i>
                    </div>
                </div>
                <h1 class="title">
                    <span class="title-main">JARVIS</span>
                    <span class="title-sub">AI Assistant</span>
                </h1>
            </header>

            <!-- Assistant Animation -->
            <div class="image-container">
                <div class="image-wrapper">
                    <img src="giphy.gif" alt="AI Assistant Animation" loading="lazy">
                    <div class="image-glow"></div>
                </div>
            </div>

            <!-- Description -->
            <p class="description">
                <i class="fas fa-microphone icon-pulse"></i>
                I'm your virtual assistant. Ask me anything!
            </p>

            <!-- Response Display -->
            <div class="response-container" id="responseContainer">
                <div class="response-content">
                    <p class="response-text" id="responseText">Your responses will appear here...</p>
                </div>
            </div>

            <!-- Voice Input Section -->
            <section class="input-section">
                <div class="input-wrapper">
                    <button class="talk" aria-label="Start voice command">
                        <div class="mic-icon">
                            <i class="fas fa-microphone"></i>
                        </div>
                        <span class="content">Click to speak</span>
                        <div class="status-indicator idle"></div>
                    </button>
                </div>
                
                <!-- Quick Commands -->
                <div class="quick-commands">
                    <p class="quick-title">Try saying or click:</p>
                    <div class="command-chips">
                        <span class="chip" data-command="what time is it">"What time is it?"</span>
                        <span class="chip" data-command="open youtube">"Open YouTube"</span>
                        <span class="chip" data-command="search wikipedia">"Search Wikipedia"</span>
                        <span class="chip" data-command="tell me a joke">"Tell me a joke"</span>
                    </div>
                </div>
            </section>

            <!-- Footer -->
            <footer class="footer">
                <p>Powered by Web Speech API</p>
            </footer>
        </div>
    </main>

    <script src="app.js"></script>
</body>

</html>
