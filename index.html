<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>
    <link rel="shortcut icon" href="avatar.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
</head>

<body>
    <section class="main">
        <div class="image-container">
            <div class="image">
                <img src="giphy.gif" alt="AI Assistant Image">
            </div>
            <h1>AI Assistant</h1>
            <p>I'm a Virtual Assistant, How may I help you?</p>
        </div>
        <div class="input">
            <button class="talk" aria-label="Start listening"><i class="fas fa-microphone-alt"><p class="content">Click here to speak</p></i></button>
        </div>
    </section>
    <script src="app.js"></script>
</body>

</html>
